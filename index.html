<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Son Hak</title>
  <style>
    body {
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: #fff0f5;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    h1 {
      margin-bottom: 30px;
      font-size: 28px;
    }

    button {
      font-size: 22px;
      padding: 15px 35px;
      margin: 10px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
    }

    #seviyorum {
      background: #ff4d6d;
      color: white;
      font-weight: bold;
    }

    #sevmiyorum {
      background: #ccc;
    }
  </style>
</head>
<body>

  <h1 id="mesaj">Enesin verdiği son hak 😶‍🌫️</h1>

  <div>
    <button id="seviyorum" onclick="seviyorum()">Seni seviyorum ❤️</button>
    <button id="sevmiyorum" onclick="sevmiyorum()">Seni sevmiyorum 🙃</button>
  </div>

  <script>
    let sayac = 0;

    const mesajlar = [
      "Hadi Enes bey üzülüü 😔",
      "Bak cidden üzülüyor",
      "Kalbimle oynama",
      "Son şansın bu",
      "Ciddiyim artık",
      "HADİ LAN BAS SON BU"
    ];

    function sevmiyorum() {
      document.getElementById("mesaj").innerText =
        mesajlar[sayac % mesajlar.length];
      sayac++;
    }

    function seviyorum() {
      document.getElementById("mesaj").innerText =
        "Doğru kararı verdin 😌❤️";
    }
  </script>

</body>
</html>
